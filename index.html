<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="고객 문의 상담 정보를 기록하고 Excel 입력용 데이터를 준비합니다.">
		<title>Customer Inquiry Logging</title>
		<link rel="stylesheet" href="style.css">
		<script src="app.js" defer></script>
	</head>
	<body>
		<header>
			<h1>Customer Inquiry Logging</h1>
		</header>

		<main>
			<section aria-labelledby="consultation-heading">
				<h2 id="consultation-heading">상담 내용 붙여넣기</h2>
				<p id="consultation-hint">전화 상담 메모, 네이버 톡톡, 카카오톡 채널, 이메일 등의 상담 내용을 복사하여 붙여넣으세요.</p>
				<textarea id="consultation-text" rows="12" aria-labelledby="consultation-heading" aria-describedby="consultation-hint"></textarea>

				<div>
					<label for="contact-route">Contact route</label>
					<select id="contact-route" name="contact-route">
						<option value="" selected>선택하세요</option>
						<option value="전화">전화</option>
						<option value="네이버 톡톡">네이버 톡톡</option>
						<option value="카카오톡 채널">카카오톡 채널</option>
						<option value="이메일">이메일</option>
						<option value="기타">기타</option>
					</select>
				</div>

				<button id="extract-info" type="button">정보 추출</button>
				<p id="text-extraction-status" role="status" aria-live="polite"></p>
			</section>

			<section aria-labelledby="results-heading">
				<h2 id="results-heading">추출 결과</h2>
				<p>확인되지 않은 정보는 공란으로 유지해 주세요.</p>

				<form id="inquiry-form">
					<div>
						<label for="inquiry-date">연락일</label>
						<input id="inquiry-date" name="연락일" type="date">
					</div>
					<div>
						<label for="result-contact-route">Contact route</label>
						<input id="result-contact-route" name="Contact route" type="text">
					</div>
					<div>
						<label for="company-name">기업명</label>
						<input id="company-name" name="기업명" type="text">
					</div>
					<div>
						<label for="contact-person">담당자</label>
						<input id="contact-person" name="담당자" type="text">
					</div>
					<div>
						<label for="phone">전화</label>
						<input id="phone" name="전화" type="tel">
					</div>
					<div>
						<label for="email">이메일</label>
						<input id="email" name="이메일" type="email">
					</div>
					<div>
						<label for="customer-category">고객분류</label>
						<input id="customer-category" name="고객분류" type="text">
					</div>
					<div>
						<label for="end-user">END USER</label>
						<input id="end-user" name="END USER" type="text">
					</div>
					<div>
						<label for="equipment">적용장비</label>
						<input id="equipment" name="적용장비" type="text">
					</div>
					<div>
						<label for="item">품목</label>
						<input id="item" name="품목" type="text">
					</div>
					<div>
						<label for="gp">GP</label>
						<input id="gp" name="GP" type="text">
					</div>
					<div>
						<label for="unit-price">단가(VAT포함)</label>
						<input id="unit-price" name="단가(VAT포함)" type="text" inputmode="decimal">
					</div>
					<div>
						<label for="quantity">수량</label>
						<input id="quantity" name="수량" type="text" inputmode="decimal">
					</div>
					<div>
						<label for="sales-price">판매가</label>
						<input id="sales-price" name="판매가" type="text" inputmode="decimal">
					</div>
					<div>
						<label for="delivery-date">납기</label>
						<input id="delivery-date" name="납기" type="text">
					</div>
					<div>
						<label for="won-lost">Won/Lost</label>
						<select id="won-lost" name="Won/Lost">
							<option value="" selected>선택하세요</option>
							<option value="Won">Won</option>
							<option value="Lost">Lost</option>
						</select>
					</div>
					<div>
						<label for="quotation-purpose">견적목적 (입찰 여부)</label>
						<input id="quotation-purpose" name="견적목적 (입찰 여부)" type="text">
					</div>
					<div>
						<label for="assignee">이관 대리점 또는 영업담당자</label>
						<input id="assignee" name="이관 대리점 또는 영업담당자" type="text">
					</div>
				</form>
			</section>

			<section aria-labelledby="excel-heading">
				<h2 id="excel-heading">Excel 입력</h2>
				<button type="button" id="copy-to-excel">Excel용으로 복사</button>
				<p id="copy-status" role="status" aria-live="polite"></p>
			</section>
		</main>
	</body>
</html>
